<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>17 October 2026</title>

<style>

:root{
--burgundy:#7b1e2b;
--gold:#b08a4f;
--goldlight:#eadfc7;
--cream:#faf7f2;
--text:#4a4038;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Georgia,serif;
color:var(--text);
background:#fff;
line-height:1.7;
}

.hero{
position:relative;
overflow:hidden;
text-align:center;
padding:120px 20px;
background:
radial-gradient(circle at 15% 20%, rgba(123,30,43,.15) 0 4px, transparent 5px),
radial-gradient(circle at 80% 35%, rgba(123,30,43,.15) 0 4px, transparent 5px),
radial-gradient(circle at 60% 80%, rgba(123,30,43,.12) 0 4px, transparent 5px),
linear-gradient(180deg,#ffffff,#faf7f2,#ffffff);
}

.hero::after{
content:"";
position:absolute;
left:-10%;
bottom:-140px;
width:120%;
height:260px;
background:linear-gradient(90deg,#d8c299,#fff,#d8c299);
border-radius:50%;
transform:rotate(-2deg);
}

.language-bar{
text-align:right;
padding:15px 20px;
}

.language-bar button{
border:none;
background:white;
cursor:pointer;
color:var(--burgundy);
font-size:15px;
margin-left:10px;
font-weight:bold;
}

.hero h1{
font-size:72px;
font-style:italic;
font-weight:normal;
color:var(--burgundy);
position:relative;
z-index:2;
}

.line{
width:120px;
height:2px;
background:var(--gold);
margin:20px auto;
position:relative;
z-index:2;
}

.hero h2{
color:var(--gold);
letter-spacing:4px;
font-weight:normal;
position:relative;
z-index:2;
}

.hero p{
max-width:700px;
margin:20px auto;
position:relative;
z-index:2;
}

.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

.card{
background:#fff;
border:1px solid var(--goldlight);
border-radius:25px;
padding:35px;
margin-bottom:25px;
box-shadow:0 8px 18px rgba(0,0,0,.06);
}

h3{
color:var(--gold);
font-size:32px;
margin-bottom:20px;
}

.time{
color:var(--burgundy);
font-size:24px;
font-weight:bold;
}

.timeline-row{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.timeline-box{
flex:1;
min-width:250px;
text-align:center;
padding:20px;
border:1px solid var(--goldlight);
border-radius:18px;
}

.image-card{
display:flex;
gap:20px;
align-items:center;
flex-wrap:wrap;
margin-top:25px;
}

.image-card img{
width:260px;
border-radius:18px;
}

label{
display:block;
margin-top:10px;
}

input,select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin-top:8px;
margin-bottom:15px;
}
