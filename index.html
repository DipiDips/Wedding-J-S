}

}

.hero h2{

}

.hero p{

    margin-bottom:20px;

}

}

.button:hover{
    background:#631824;
}

.notice{

    border-left:5px solid var(--gold);
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

    margin-bottom:5px;
    font-weight:bold;
}
