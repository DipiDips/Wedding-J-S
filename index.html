<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jelena & Sergej | 17 October 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
    --gold:#ff2d2d;
    --light-gold:#ff5757;
    --cream:#f4e7c1;
    --dark-red:#400;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    margin:0;
    font-family:'Cormorant Garamond',serif;

    background-color:#f5f5f5;

    background-image:url('Beige and Black Minimal Elegant Wedding Invitation (2).png');
    background-position:center top;
    background-repeat:repeat-y;
    background-size:100% auto;

    color:#5c1b1b;
}

.overlay{
    background:transparent;
    min-height:100vh;
}

.language-switcher{
    position:fixed;
    top:18px;
    right:18px;
    z-index:1000;
    display:flex;
    gap:8px;
    padding:8px;
    background:rgba(40,0,0,.45);
    border:1px solid var(--gold);
    border-radius:999px;
    backdrop-filter:blur(6px);
}
.lang-btn{
    cursor:pointer;
    border:1px solid transparent;
    background:transparent;
    color:var(--cream);
    padding:8px 13px;
    border-radius:999px;
    font-family:'Cormorant Garamond',serif;
    font-size:17px;
    font-weight:600;
    transition:.25s ease;
}
.lang-btn:hover,.lang-btn.active{
    background:var(--gold);
    color:var(--dark-red);
    border-color:var(--light-gold);
}
.hero{text-align:center;padding:110px 20px 90px}
.hero h1{font-size:92px;font-weight:300;color:var(--light-gold);text-shadow:0 0 20px rgba(212,175,55,.5);margin:0}
.hero h2{letter-spacing:6px;margin-bottom:10px}
.hero .welcome{font-size:25px;max-width:760px;margin:22px auto 0;line-height:1.45}
.goldline{width:280px;height:2px;background:var(--gold);margin:20px auto}
.container{max-width:1200px;margin:auto;padding:20px}
.panel{
    background:rgba(255,255,255,0.45);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid rgba(255,40,40,0.35);
    box-shadow:
        0 8px 32px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,0.6);

    border-radius:28px;
    padding:35px;
    margin-bottom:30px;
}
.hero h1,
.hero h2,
.welcome,
.card h3,
.card p,
.parking-text,
.section-text,
label,
.title,
.time{
    color:#a62828;
}

.title{text-align:center;font-size:42px;color:var(--light-gold);margin-bottom:18px}
.title:before,.title:after{content:'';display:inline-block;width:100px;height:1px;background:var(--gold);vertical-align:middle;margin:0 15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
	.card{
    text-align:center;
    border:1px solid rgba(255,40,40,0.35);
    border-radius:24px;
    padding:22px;

    background:rgba(255,255,255,0.35);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}
.time{font-size:32px;font-weight:600;color:var(--light-gold)}
.card h3{font-size:24px;margin:10px 0}.card p{font-size:20px;margin:8px 0 14px}
.photo{width:100%;height:340px;object-fit:cover;border-radius:18px;border:2px solid var(--gold);margin-top:18px}
	.invitation-panel{
    text-align:center;
}

.invitation-image{
    width:100%;
    max-width:650px;
    border-radius:18px;
    border:2px solid var(--gold);
}
.btn-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.action-btn{
    display:inline-block;
    padding:10px 20px;
    background:var(--gold);
    color:var(--dark-red);
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
    font-size:18px;
    border:2px solid #c62828;
    background:#fffaf9;
    transition:.25s ease;
}
.action-btn:hover{background:var(--light-gold);transform:translateY(-1px)}
.secondary-btn{background:transparent;color:var(--light-gold);border-color:var(--gold)}
.secondary-btn:hover{background:rgba(212,175,55,.16);color:var(--cream)}
.parking-text,.section-text{text-align:center;font-size:22px;line-height:1.45;max-width:820px;margin:0 auto 20px}
.parking-img{display:block;margin:25px auto;max-width:500px;width:100%;border:2px solid var(--gold);border-radius:18px}
label{display:block;margin-top:10px;font-size:19px}
input,select{width:100%;padding:12px;border-radius:10px;border:2px solid #c62828;background:#fff;color:#5c1b1b;margin:8px 0 15px;font-size:16px;}
input:focus,
select:focus{outline:none;border-color:#e53935;box-shadow:0 0 8px rgba(198,40,40,0.25);}
select{
    cursor:pointer;
}	
	
@media(max-width:800px){

    .grid{
        grid-template-columns:1fr;
    }

    body{
        background-color:#f5f5f5;
        background-image:url('Beige and Black Minimal Elegant Wedding Invitation (2).png');
        background-position:center top;
        background-repeat:repeat-y;
        background-size:220% auto;
    }
    .grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:58px;
    }

    .hero{
        padding-top:125px;
    }

    .hero .welcome{
        font-size:21px;
    }

    .title{
        font-size:34px;
    }

    .title:before,
    .title:after{
        width:42px;
        margin:0 8px;
    }

    .panel{
        padding:24px;
    }

    .language-switcher{
        left:50%;
        right:auto;
        transform:translateX(-50%);
        top:14px;
    }

    .lang-btn{
        font-size:15px;
        padding:7px 10px;
    }
}
</style>
</head>
<body>
<div class="overlay">
    <nav class="language-switcher" aria-label="Language selector">
        <button class="lang-btn" data-lang="sr" type="button">SR</button>
        <button class="lang-btn" data-lang="en" type="button">EN</button>
        <button class="lang-btn" data-lang="sk" type="button">SK</button>
    </nav>

    <section class="hero">

        <h1>Jelena & Sergej</h1>
        <div class="goldline"></div>
        <h2>17 OCTOBER 2026</h2>
        <p class="welcome" data-i18n="welcome"></p>
    </section>

    <div class="container">
        <div class="panel">
            <div class="title" data-i18n="weddingDay"></div>
            <div class="grid">
                <div class="card">
                    <div class="time">09:00</div>
                    <h3 data-i18n="sergejGathering"></h3>
                    <p>Rakovac</p>
                </div>
                <div class="card">
                    <div class="time">10:30</div>
                    <h3 data-i18n="jelenaGathering"></h3>
                    <p>Rušanj</p>
                </div>
            </div>
            <br>
            <div class="grid">
                <div class="card">
                    <div class="time">13:30</div>
                    <h3 data-i18n="churchWedding"></h3>
                    <h3>Hram Svete Petke</h3>
                    <p>Rušanj</p>
                    <div class="btn-row">
                        <a class="action-btn" href="https://maps.app.goo.gl/9i5gDYa4R96HHx4R6" target="_blank" rel="noopener noreferrer" data-i18n="navigation"></a>
                    </div>
                    <img class="photo" src="Hram.jpg" alt="Hram Svete Petke">
                </div>
                <div class="card">
                    <div class="time">15:45</div>
                    <h3 data-i18n="civilWedding"></h3>
                    <h3>Garden Hill</h3>
                    <p>Novi Beograd</p>
                    <div class="btn-row">
                        <a class="action-btn" href="https://maps.app.goo.gl/eHakzf7Jvc6yafLc8" target="_blank" rel="noopener noreferrer" data-i18n="navigation"></a>
                        <a class="action-btn secondary-btn" href="#parking" data-i18n="parkingButton"></a>
                    </div>
                    <img class="photo" src="Garden Hill.jpg" alt="Garden Hill">
                </div>
            </div>
        </div>

        <div class="panel" id="parking">
            <div class="title" data-i18n="arrivalParking"></div>
            <p class="parking-text" data-i18n="parkingText"></p>
            <img class="parking-img" src="ParkingGardenHill.jpg" alt="Parking Garden Hill">
            <p style="text-align:center;">
                <a class="action-btn" href="https://maps.app.goo.gl/eHakzf7Jvc6yafLc8" target="_blank" rel="noopener noreferrer" data-i18n="openMaps"></a>
            </p>
        </div>

        <div class="panel">
    <div class="title">RSVP</div>

    <form id="rsvpForm">

        <label data-i18n="guestCount"></label>

        <select id="cnt">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
        </select>

        <div id="guests"></div>

        <label data-i18n="attending"></label>
        <select id="attending">
    		<option value="Yes" data-i18n="yes"></option>
    		<option value="No" data-i18n="no"></option>
		</select>

<div class="panel">

    <div class="title" data-i18n="accommodation"></div>

    <p class="section-text" data-i18n-html="accommodationInfo"></p>

    <label data-i18n="needAccommodation"></label>

<select id="accommodation">
    <option value="No" selected data-i18n="no"></option>
    <option value="Yes" data-i18n="yes"></option>
</select>

<div id="accommodationDetails" style="display:none;">

    <label data-i18n="peopleForAccommodation">
        Number of people requiring accommodation
    </label>

    <select id="accommodationGuests">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
    </select>

    <label data-i18n="roomCount">
        Number of rooms
    </label>

    <select id="rooms">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
    </select>

</div>

</div>

        <button
    type="submit"
    class="action-btn"
    style="width:100%;margin-top:20px;cursor:pointer;"
    data-i18n="submitRsvp"
></button>

    </form>

</div>
    </div>
</div>

<script>
const translations = {
    sr: {
        welcome: "Radujemo se što ćemo ovaj poseban dan podeliti sa vama.",
        weddingDay: "Dan venčanja",
        sergejGathering: "Okupljanje kod Sergeja",
        jelenaGathering: "Okupljanje kod Jelene",
        churchWedding: "Crkveno venčanje",
        civilWedding: "Građansko venčanje",
        navigation: "📍 Navigacija",
        parkingButton: "🚗 Parking",
        arrivalParking: "Dolazak i parking",
        parkingText: "Parking za goste nalazi se neposredno ispred objekta Garden Hill. Označena zona na slici prikazuje preporučeno mesto za parkiranje.",
        openMaps: "🗺️ Otvori u Google Maps",
        guestCount: "Broj gostiju",
        guest: "Gost",
        attending: "Dolazi?",
        yes: "Da",
        no: "Ne",
        accommodation: "Smeštaj",
        accommodationText: "Smeštaj je dostupan direktno u objektu Garden Hill.<br><br><b>35 € po osobi po noćenju.</b>",
        needAccommodation: "Da li vam je potreban smeštaj?",
        peopleForAccommodation: "Broj osoba za smeštaj",
        roomCount: "Broj soba",
		firstName: "Ime",
		lastName: "Prezime",
		submitRsvp: "Pošalji RSVP",
		sending: "Slanje...",
		accommodationInfo: "Smeštaj je dostupan direktno u objektu Garden Hill.<br><br><strong>35 € po osobi po noćenju.</strong><br><br>Dostupne vrste soba:<br>• Dvokrevetna soba<br>• Trokrevetna soba<br>• Četvorokrevetna soba",
    },
    en: {
        welcome: "We are delighted to celebrate this special day with you.",
        weddingDay: "Wedding Day",
        sergejGathering: "Gathering at Sergej's place",
        jelenaGathering: "Gathering at Jelena's place",
        churchWedding: "Church Ceremony",
        civilWedding: "Civil Ceremony",
        navigation: "📍 Navigation",
        parkingButton: "🚗 Parking",
        arrivalParking: "Arrival and Parking",
        parkingText: "Guest parking is available directly in front of Garden Hill. The marked area in the picture shows the recommended parking location.",
        openMaps: "🗺️ Open in Google Maps",
        guestCount: "Number of guests",
        guest: "Guest",
        attending: "Attending?",
        yes: "Yes",
        no: "No",
        accommodation: "Accommodation",
        accommodationText: "Accommodation is available directly at Garden Hill.<br><br><b>35 € per person per night.</b>",
        needAccommodation: "Do you need accommodation?",
        peopleForAccommodation: "Number of people for accommodation",
        roomCount: "Number of rooms",
		firstName: "Name",
		lastName: "Surname",
		submitRsvp: "Submit RSVP",
		sending: "Sending...",
		accommodationInfo: "Accommodation is available directly at Garden Hill.<br><br><strong>35 € per person per night.</strong><br><br>Available room types:<br>• 2-bed room<br>• 3-bed room<br>• 4-bed room",
    },
    sk: {
        welcome: "Tešíme sa, že s vami oslávime tento výnimočný deň.",
        weddingDay: "Svadobný deň",
        sergejGathering: "Stretnutie u Sergeja",
        jelenaGathering: "Stretnutie u Jeleny",
        churchWedding: "Cirkevný obrad",
        civilWedding: "Civilný obrad",
        navigation: "📍 Navigácia",
        parkingButton: "🚗 Parkovanie",
        arrivalParking: "Príchod a parkovanie",
        parkingText: "Parkovanie pre hostí je k dispozícii priamo pred objektom Garden Hill. Označená oblasť na obrázku zobrazuje odporúčané miesto na parkovanie.",
        openMaps: "🗺️ Otvoriť v Google Maps",
        guestCount: "Počet hostí",
        guest: "Hosť",
        attending: "Zúčastní sa?",
        yes: "Áno",
        no: "Nie",
        accommodation: "Ubytovanie",
        accommodationText: "Ubytovanie je dostupné priamo v objekte Garden Hill.<br><br><b>35 € za osobu za noc.</b>",
        needAccommodation: "Potrebujete ubytovanie?",
        peopleForAccommodation: "Počet osôb na ubytovanie",
        roomCount: "Počet izieb",
		firstName: "Meno",
		lastName: "Priezvisko",
		submitRsvp: "Odoslať RSVP",
		sending: "Odosielanie...",
		accommodationInfo: "Ubytovanie je dostupné priamo v objekte Garden Hill.<br><br><strong>35 € za osobu na noc.</strong><br><br>Dostupné typy izieb:<br>• Dvojlôžková izba<br>• Trojlôžková izba<br>• Štvorlôžková izba",
    }
};

let currentLanguage = localStorage.getItem("weddingLanguage") || "sr";

function applyLanguage(lang){
    currentLanguage = lang;
    localStorage.setItem("weddingLanguage", lang);
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if(translations[lang].hasOwnProperty(key))
    el.textContent = translations[lang][key];
    });

    document.querySelectorAll("[data-i18n-html]").forEach(el => {
        const key = el.getAttribute("data-i18n-html");
        if(translations[lang].hasOwnProperty(key))
    el.innerHTML = translations[lang][key];

    });

    document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.lang === lang);
});

const submitBtn =
    document.querySelector('[data-i18n="submitRsvp"]');

if(submitBtn){
    submitBtn.textContent =
        translations[lang].submitRsvp;
}

renderGuests();
}

function renderGuests() {

    const countSelect = document.getElementById("cnt");
    const guestsDiv = document.getElementById("guests");

    if (!countSelect || !guestsDiv) return;

    const n = parseInt(countSelect.value, 10);

    let html = "";

    for (let i = 1; i <= n; i++) {

        html += `
        <div style="
            border:1px solid var(--gold);
            border-radius:16px;
            padding:18px;
            margin-bottom:20px;
        ">
            <h3>${translations[currentLanguage].guest} ${i}</h3>

            <div style="
                display:grid;
                grid-template-columns:1fr 1fr;
                gap:15px;
            ">
                <div>
                    <label>${translations[currentLanguage].firstName}</label>
                    <input
    type="text"
    id="guest${i}Name"
    ${i === 1 ? 'required' : ''}
/>
                </div>

                <div>
                    <label>${translations[currentLanguage].lastName}</label>
                    <input
    type="text"
    id="guest${i}Surname"
    ${i === 1 ? 'required' : ''}
/>
                </div>
            </div>
        </div>
        `;
    }

    guestsDiv.innerHTML = html;
}



document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => applyLanguage(btn.dataset.lang));
});

document.getElementById("cnt").addEventListener("change", renderGuests);
applyLanguage(currentLanguage);
</script>
	<script>

const scriptUrl = "https://script.google.com/macros/s/AKfycbzPEsscWPnyyfqKBZo8dM1yIc_nUE0kk4heqiso74KZlBnfcsee5h7jw7RCViILNFNVUA/exec";

document.addEventListener("change", function(e){

    if(e.target.id === "accommodation"){

        const details =
            document.getElementById("accommodationDetails");

        details.style.display =
            e.target.value === "Yes"
                ? "block"
                : "none";
    }
});

document.addEventListener("submit", async function(e){

    if(e.target.id !== "rsvpForm") return;

    e.preventDefault();

    const button =
        document.querySelector("#rsvpForm button");

    button.disabled = true;
    button.textContent =
    translations[currentLanguage].sending;

let guestList = [];

for(let i = 1; i <= 5; i++){

    const name =
        document.getElementById(`guest${i}Name`)?.value || "";

    const surname =
        document.getElementById(`guest${i}Surname`)?.value || "";

    if(name.trim() || surname.trim()){

        guestList.push(
            `${name} ${surname}`.trim()
        );
    }
}

const data = {
    name: document.getElementById("guest1Name")?.value || "",
    surname: document.getElementById("guest1Surname")?.value || "",

    guest2Name: document.getElementById("guest2Name")?.value || "",
    guest2Surname: document.getElementById("guest2Surname")?.value || "",

    guest3Name: document.getElementById("guest3Name")?.value || "",
    guest3Surname: document.getElementById("guest3Surname")?.value || "",

    guest4Name: document.getElementById("guest4Name")?.value || "",
    guest4Surname: document.getElementById("guest4Surname")?.value || "",

    guest5Name: document.getElementById("guest5Name")?.value || "",
    guest5Surname: document.getElementById("guest5Surname")?.value || "",

    attending: document.getElementById("attending").value,
    guests: document.getElementById("cnt").value,
    accommodation: document.getElementById("accommodation").value,
    rooms: document.getElementById("rooms").value,
    accommodationGuests:
        document.getElementById("accommodationGuests")?.value || ""
};

    try {

       const formData = new FormData();

Object.keys(data).forEach(key => {
    formData.append(key, data[key]);
});

await fetch(scriptUrl, {
    method: "POST",
    mode: "no-cors",
    body: formData
});

        alert(
            "❤️ Thank you for your response! ❤️\n\nWe can't wait to celebrate with you!"
        );

        document.getElementById("rsvpForm").reset();

        renderGuests();

    } catch(error){

        console.error(error);

        alert(
            "Something went wrong. Please try again."
        );

    } finally {

        button.disabled = false;
        button.textContent =
    translations[currentLanguage].submitRsvp;

    }
});

window.addEventListener("load", () => {

    renderGuests();

    document.getElementById(
        "accommodationDetails"
    ).style.display = "none";

});

</script>
</body>
</html>
